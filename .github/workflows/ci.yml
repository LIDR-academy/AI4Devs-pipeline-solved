name: CI/CD Pipeline - Tests Build Deploy

on:
  push:
    branches:
      - pipeline-iniciales
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "16"

      - name: Install dependencies (backend)
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests (backend)
        working-directory: backend
        run: |
          npm test

      - name: Build backend (dist)
        working-directory: backend
        run: |
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          S3_BUCKET=${S3_BUCKET:-cursolidr}
          echo "Uploading to S3 bucket: $S3_BUCKET"
          aws s3 cp backend/ s3://$S3_BUCKET/backend/ --recursive

      - name: Add EC2 Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Load SSH key and deploy to EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 (via ssh)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Deploying to EC2 host..."
          S3_BUCKET=${S3_BUCKET:-cursolidr}
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Configure AWS credentials temporarily
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION="eu-north-1"
            
            # Prepare app directory
            mkdir -p /home/ubuntu/backend
            cd /home/ubuntu/backend

            # Download code from S3
            aws s3 cp s3://${S3_BUCKET}/backend/ . --recursive

            # Install dependencies, build and start with PM2
            if [ -f package.json ]; then
              npm install || true
              npm run build || true
              pm2 stop my-app || true
              pm2 start npm --name my-app -- start -- --port 8080
              
              # Configure nginx proxy
              echo "server {
                listen 80;
                server_name _;
                location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                }
              }" | sudo tee /etc/nginx/conf.d/app.conf > /dev/null
              sudo systemctl reload nginx
            fi
          EOF
