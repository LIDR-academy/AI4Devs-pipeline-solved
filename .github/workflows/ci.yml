name: CI/CD Pipeline - Tests Build Deployname: CI/CD Pipeline - Tests Build Deploy



on:on:

  pull_request:  pull_request:

    branches:    branches:

      - main      - main



jobs:jobs:

  build:  build:

    runs-on: ubuntu-latest    runs-on: ubuntu-latest



    steps:    steps:

      - name: Checkout code      - name: Checkout code

        uses: actions/checkout@v2        uses: actions/checkout@v2



      - name: Set up Node.js      - name: Set up Node.js

        uses: actions/setup-node@v2        uses: actions/setup-node@v2

        with:        with:

          node-version: "16"          node-version: "16"

          cache: "npm"          cache: "npm"



      - name: Install dependencies (backend)      - name: Install dependencies (backend)

        working-directory: backend        working-directory: backend

        run: |        run: |

          if [ -f package-lock.json ]; then npm ci; else npm install; fi          if [ -f package-lock.json ]; then npm ci; else npm install; fi



      - name: Run tests (backend)      - name: Run tests (backend)

        working-directory: backend        working-directory: backend

        run: |        run: |

          npm test          npm test



      - name: Build backend (dist)      - name: Build backend (dist)

        working-directory: backend        working-directory: backend

        run: |        run: |

          npm run build          npm run build



  deploy:  deploy:

    runs-on: ubuntu-latest    runs-on: ubuntu-latest

    needs: build    needs: build

    if: github.event_name == 'pull_request'    if: github.event_name == 'pull_request'



    steps:    steps:

      - name: Checkout code      - name: Checkout code

        uses: actions/checkout@v2        uses: actions/checkout@v2



      - name: Configure AWS Credentials      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v2        uses: aws-actions/configure-aws-credentials@v2

        with:        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: eu-north-1          aws-region: eu-north-1



      - name: Upload to S3      - name: Upload to S3

        env:        env:

          S3_BUCKET: ${{ secrets.S3_BUCKET }}          S3_BUCKET: ${{ secrets.S3_BUCKET }}

        run: |        run: |

          S3_BUCKET=${S3_BUCKET:-cursolidr}          S3_BUCKET=${S3_BUCKET:-cursolidr}

          echo "Uploading to S3 bucket: $S3_BUCKET"          echo "Uploading to S3 bucket: $S3_BUCKET"

          aws s3 cp backend/ s3://$S3_BUCKET/backend/ --recursive          aws s3 cp backend/ s3://$S3_BUCKET/backend/ --recursive



      - name: Add EC2 Host Key      - name: Add EC2 Host Key

        run: |        run: |

          mkdir -p ~/.ssh          mkdir -p ~/.ssh

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts



      - name: Load SSH key and deploy to EC2      - name: Load SSH key and deploy to EC2

        uses: webfactory/ssh-agent@v0.8.1        uses: webfactory/ssh-agent@v0.8.1

        with:        with:

          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}



      - name: Deploy to EC2 (via ssh)      - name: Deploy to EC2 (via ssh)

        env:        env:

          EC2_HOST: ${{ secrets.EC2_HOST }}          EC2_HOST: ${{ secrets.EC2_HOST }}

          EC2_USER: ${{ secrets.EC2_USER }}          EC2_USER: ${{ secrets.EC2_USER }}

          S3_BUCKET: ${{ secrets.S3_BUCKET }}          S3_BUCKET: ${{ secrets.S3_BUCKET }}

        run: |        run: |

          echo "Deploying to EC2 host..."          echo "Deploying to EC2 host..."

          S3_BUCKET=${S3_BUCKET:-cursolidr}          S3_BUCKET=${S3_BUCKET:-cursolidr}

          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << EOF

            export NVM_DIR="$HOME/.nvm"            export NVM_DIR="$HOME/.nvm"

            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                        

            # Prepare app directory            # Prepare app directory

            mkdir -p /home/ubuntu/backend            mkdir -p /home/ubuntu/backend

            cd /home/ubuntu/backend            cd /home/ubuntu/backend



            # Download code from S3            # Download code from S3

            aws s3 cp s3://${S3_BUCKET}/backend/ . --recursive            aws s3 cp s3://${S3_BUCKET}/backend/ . --recursive



            # Install dependencies, build and start with PM2            # Install dependencies, build and start with PM2

            npm install || true            npm install || true

            npm run build || true            npm run build || true

            pm2 stop my-app || true            pm2 stop my-app || true

            pm2 start npm --name my-app -- start -- --port 8080            pm2 start npm --name my-app -- start -- --port 8080

          EOF          EOF
        uses: actions/setup-node@v2
        with:
          node-version: "16"
          cache: "npm"

      - name: Install dependencies (backend)
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests (backend)
        working-directory: backend
        run: |
          npm test

      - name: Build backend (dist)
        working-directory: backend
        run: |
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # default to the known bucket name 'cursolidr' if S3_BUCKET secret is not set
          S3_BUCKET=${S3_BUCKET:-cursolidr}
          echo "Uploading to S3 bucket: $S3_BUCKET"
          aws s3 cp backend/ s3://$S3_BUCKET/backend/ --recursive

      - name: Add EC2 Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Load SSH key and deploy to EC2
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 (via ssh)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Deploying to EC2 host..."
          ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << 'EOF'
            export AWS_REGION=${AWS_REGION}
            # Install Nginx if not already installed
            if ! command -v nginx &> /dev/null; then
              if command -v yum &> /dev/null; then
                sudo yum update -y
                sudo yum install -y nginx
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update -y
                sudo apt-get install -y nginx
              fi
            fi

            # Install Node if not present
            if ! command -v node &> /dev/null; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              source ~/.bashrc
              nvm install --lts
            fi

            sudo mkdir -p /etc/nginx/conf.d
            echo "server {\n  listen 80;\n  server_name ${EC2_HOST};\n  location / { proxy_pass http://localhost:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }\n}" | sudo tee /etc/nginx/conf.d/app.conf > /dev/null
            sudo systemctl restart nginx || true

            # Prepare app directory
            mkdir -p /home/ec2-user/backend
            cd /home/ec2-user/backend

            # Download code from S3
            aws s3 cp s3://$S3_BUCKET/backend/ . --recursive

            # Install dependencies, build and start with PM2
            if ! command -v pm2 &> /dev/null; then npm install -g pm2; fi
            npm install || true
            npm run build || true
            pm2 stop my-app || true
            pm2 start npm --name my-app -- start -- --port 8080
            exit
          EOF
