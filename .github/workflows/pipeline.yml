name: CI/CD Pipeline

on:
  # Se dispara con push a ramas que tengan un PR abierto hacia main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  # Se dispara manualmente desde GitHub UI (botón "Run workflow")
  workflow_dispatch:

jobs:
  # Job 1: Tests de backend
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm test

  # Job 2: Build del backend
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Build backend
        run: |
          cd backend
          npx tsc --project tsconfig.json

      - name: Upload build artifacts to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_REGION: 'us-east-2'
        run: |
          aws s3 sync backend/ s3://mi-ec2-con-github-actions/backend/ \
            --exclude "node_modules/*" \
            --exclude ".env" \
            --delete

  # Job 3: Deploy a EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add EC2 Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_INSTANCE }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_INSTANCE: ${{ secrets.EC2_INSTANCE }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          echo "$EC2_SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_INSTANCE << 'EOF'
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            export AWS_REGION='us-east-2'

            # Sync from S3
            aws s3 sync s3://mi-ec2-con-github-actions/backend/ /app/backend/ --delete

            # Install dependencies
            cd /app/backend
            npm ci --production

            # Run Prisma migrations
            npx prisma migrate deploy

            # Restart application with PM2
            if pm2 describe backend > /dev/null 2>&1; then
              pm2 restart backend
            else
              pm2 start dist/index.js --name backend
            fi

            # Health check
            sleep 5
            curl -f http://localhost:8080/ || exit 1
            echo "Deploy successful"
          EOF

          rm -f private_key.pem
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                }' | sudo tee /etc/nginx/conf.d/app.conf > /dev/null

                # Enable the site configuration
                sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default

                # Restart Nginx to apply the new configuration
                sudo systemctl restart nginx

                # Install PM2 if not already installed
                if ! command -v pm2 &> /dev/null; then
                npm install -g pm2
                fi

                # Stop the application if it's running
                pm2 stop all || true

                # Create the directory if it doesn't exist
                mkdir -p /home/ec2-user/backend
                cd /home/ec2-user/backend

                # Download the code from S3
                aws s3 cp s3://mi-ec2-con-github-actions/backend/ . --recursive

                # Install dependencies and run the application with PM2 on port 8080
                npm install
                npm run build
                pm2 start npm --name "my-app" -- start -- --port 8080
            EOF
